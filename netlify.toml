# Netlify build settings. Netlify detects Next.js and applies its Next.js
# adapter automatically; this file pins the build command and Node version.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # NEXT_PUBLIC_* values are public by design: Next.js inlines them into the
  # browser bundle (the Supabase URL and publishable key are meant to be
  # visible; RLS protects the data). Exclude them from secrets scanning so the
  # build isn't blocked. SUPABASE_SECRET_KEY, IP_HASH_SALT and DEMO_PASSWORD
  # are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SITE_URL"
